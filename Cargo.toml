[package]
name = "crosswalk"
version = "1.1.2"
edition = "2024"
description = "A TUI network overview for Linux with 25 bundled themes"
keywords = ["network", "tui", "monitoring", "firewall", "bandwidth"]
categories = ["command-line-utilities", "network-programming"]
license = "MIT"
repository = "https://github.com/terminusarchive/crosswalk"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.28.1"
libc = "0.2.190"
pcap = "2.3.0"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"
